name: Bug report
description: Report a reproducible problem with Domain.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues before submitting a new report. Do not include passwords, access tokens, or other private information.
  - type: input
    id: domain-version
    attributes:
      label: Domain version
      placeholder: 1.0.2
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Minecraft and server version
      placeholder: Paper 1.21.4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the actions that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
